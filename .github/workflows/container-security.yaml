name: Container Security

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write
  packages: write

jobs:
  container-scan:
    name: Scan ${{ matrix.service }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - service: adservice
            context: ./src/adservice
            dockerfile: Dockerfile

          - service: cartservice
            context: ./src/cartservice/src
            dockerfile: Dockerfile

          - service: checkoutservice
            context: ./src/checkoutservice
            dockerfile: Dockerfile

          - service: currencyservice
            context: ./src/currencyservice
            dockerfile: Dockerfile

          - service: emailservice
            context: ./src/emailservice
            dockerfile: Dockerfile

          - service: frontend
            context: ./src/frontend
            dockerfile: Dockerfile

          - service: paymentservice
            context: ./src/paymentservice
            dockerfile: Dockerfile

          - service: productcatalogservice
            context: ./src/productcatalogservice
            dockerfile: Dockerfile

          - service: recommendationservice
            context: ./src/recommendationservice
            dockerfile: Dockerfile

          - service: shippingservice
            context: ./src/shippingservice
            dockerfile: Dockerfile

          - service: loadgenerator
            context: ./src/loadgenerator
            dockerfile: Dockerfile

          - service: shoppingassistantservice
            context: ./src/shoppingassistantservice
            dockerfile: Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build container
        run: |
          docker build \
            -f "${{ matrix.context }}/${{ matrix.dockerfile }}" \
            -t "online-boutique/${{ matrix.service }}:${{ github.sha }}" \
            "${{ matrix.context }}"

      - name: Verify container image
        run: |
          docker image inspect \
            "online-boutique/${{ matrix.service  }}:${{ github.sha }}"

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: "online-boutique/${{ matrix.service }}:${{ github.sha }}"
          format: cyclonedx
          output: "sbom-${{ matrix.service }}.cdx.json"

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.cdx.json

      - name: Show Trivy vulnerability report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "online-boutique/${{ matrix.service }}:${{ github.sha }}"
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0

      - name: Scan container with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "online-boutique/${{ matrix.service }}:${{ github.sha }}"
          format: sarif
          output: "trivy-${{ matrix.service }}.sarif"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
          exit-code: 1

      - name: Upload Trivy results
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.service)) != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-${{ matrix.service }}.sarif"


      - name: Log in to GHCR
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag image for GHCR
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag \
            "online-boutique/${{ matrix.service }}:${{ github.sha }}" \
            "ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}"

      - name: Push image to GHCR
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: push
        run: |
          docker push \
            "ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}"
